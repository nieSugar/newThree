name: Persistent Three Runtime PoC

on:
  push:
    branches:
      - poc/tinyengine-three-persistent-runtime
  pull_request:
    paths:
      - 'poc-host.html'
      - 'poc-three.html'
      - 'src/poc/**'
      - 'tests/e2e/persistent-runtime.spec.ts'
      - '.github/workflows/poc-persistent-three.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/persistent-runtime.spec.ts --project=desktop
