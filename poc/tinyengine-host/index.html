<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyEngine + Persistent Three Runtime PoC</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #poc-shell { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: Arial, sans-serif; background: #0f172a; }
      #poc-shell { display: flex; }
      #tiny-engine-pane { flex: 1 1 auto; min-width: 0; height: 100%; background: #fff; }
      #app { width: 100%; height: 100%; }
      #three-runtime-pane {
        width: 38vw;
        min-width: 360px;
        max-width: 72vw;
        height: 100%;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #334155;
        background: #020617;
        transition: width 160ms ease;
      }
      #three-runtime-pane[data-mode="wide"] { width: 58vw; }
      #three-runtime-header {
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 12px;
        color: #cbd5e1;
        background: #0f172a;
        font-size: 12px;
      }
      #persistent-three-frame { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #020617; }
      #three-status { color: #67e8f9; }
    </style>
  </head>
  <body>
    <main id="poc-shell">
      <section id="tiny-engine-pane" aria-label="TinyEngine designer">
        <div id="app"></div>
      </section>
      <aside id="three-runtime-pane" data-mode="normal" aria-label="Persistent Three.js runtime">
        <div id="three-runtime-header">
          <span>Persistent Three.js Runtime</span>
          <span id="three-status">connecting</span>
        </div>
        <iframe
          id="persistent-three-frame"
          title="Persistent Three.js Runtime"
          src="http://127.0.0.1:5180/poc-three.html?hostOrigin=http%3A%2F%2F127.0.0.1%3A8090"
        ></iframe>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
